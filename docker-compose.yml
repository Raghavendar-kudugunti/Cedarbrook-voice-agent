services:
  api:
    build: .
    ports: ["${PORT:-8000}:8000"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/cedarbrook.db
    # ./data is the same database a local `uvicorn` run uses, so Docker and VS Code share one set of calls.
    # ./frontend is served live: page edits show on refresh without a rebuild (Python changes still need --build).
    volumes: ["./data:/data", "./frontend:/app/frontend:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  voice:
    build:
      context: .
      args: { WITH_MODELS: "1" }
    command: ["python", "-m", "agent.worker", "start"]
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
